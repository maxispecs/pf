packages:
  - packages/*
  - workbench

allowBuilds:
  esbuild: true
  '@vscode/vsce-sign': false
  keytar: false

# nextra-theme-docs 4.6 (packages/docs) breaks with zod 4.2+: its Layout schema makes the
# `children` key required, so every page fails with "expected nonoptional, received undefined".
overrides:
  zod: 4.1.13
