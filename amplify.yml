# AWS Amplify Hosting build for the docs site (packages/docs, a static Next.js export).
# In the Amplify console: Host web app -> connect the repo -> tick "My app is a monorepo"
# and enter the app root `packages/docs`. That sets AMPLIFY_MONOREPO_APP_ROOT.
version: 1
applications:
  - appRoot: packages/docs
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - npm install -g pnpm@12
            # install from the workspace root (pnpm-lock.yaml and pnpm-workspace.yaml live there)
            - pnpm --dir ../.. install --frozen-lockfile --filter @pulpfixer/docs...
        build:
          commands:
            # next build with DOCS_EXPORT=1 into out/, then the pagefind search index into out/_pagefind
            - pnpm run build:static
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
