<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="win">
      <rect x="36" y="56" width="184" height="148" rx="16"/>
    </clipPath>
  </defs>

  <!-- app tile -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- soft shadow under the window -->
  <rect x="36" y="64" width="184" height="148" rx="16" fill="#000" opacity="0.18"/>

  <!-- window -->
  <rect x="36" y="56" width="184" height="148" rx="16" fill="#ffffff"/>
  <g clip-path="url(#win)">
    <!-- tinted chrome: title bar + side bar -->
    <rect x="36" y="56" width="184" height="30" fill="#fcd34d"/>
    <rect x="36" y="86" width="56" height="118" fill="#fde68a"/>
    <!-- title bar bottom edge -->
    <rect x="36" y="85" width="184" height="2" fill="#f59e0b" opacity="0.35"/>
  </g>

  <!-- window controls -->
  <circle cx="56" cy="71" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="74" cy="71" r="5" fill="#ffffff" opacity="0.6"/>
  <circle cx="92" cy="71" r="5" fill="#ffffff" opacity="0.35"/>

  <!-- side bar items -->
  <rect x="48" y="102" width="32" height="7" rx="3.5" fill="#d97706" opacity="0.55"/>
  <rect x="48" y="120" width="26" height="7" rx="3.5" fill="#d97706" opacity="0.35"/>
  <rect x="48" y="138" width="30" height="7" rx="3.5" fill="#d97706" opacity="0.35"/>
  <rect x="48" y="156" width="22" height="7" rx="3.5" fill="#d97706" opacity="0.35"/>

  <!-- untouched editor: code lines -->
  <rect x="110" y="104" width="64" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="124" y="124" width="82" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="124" y="144" width="52" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="110" y="164" width="72" height="8" rx="4" fill="#cbd5e1"/>
</svg>
